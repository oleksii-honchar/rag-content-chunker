mcp:
  url: "http://localhost:8765/mcp"
  timeoutMs: 30000
  maxRetries: 2
  retryDelayMs: 500

watchSources:
  - id: "e2e-test-source"
    path: "/tmp"
    include: ["*.md"]
    exclude: []
    debounceMs: 500

chunking:
  strategy: "content-aware"
  maxSizes:
    agentSessions: 400
    obsidianNotes: 500
    codeFiles: 400
    configuration: "per-key"
    plainText: 450
  overlap: 50
  hardCap: 600

telemetry:
  enabled: false
