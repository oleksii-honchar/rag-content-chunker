# E2E test configuration for rag-content-chunker
# Points to local Mnemosyne MCP instance

watchSources:
  - id: e2e-test-source
    path: ./e2e-test-files
    include:
      - '*.md'
      - '*.ts'
      - '*.json'
      - '*.yaml'
      - '*.txt'
    exclude:
      - '**/node_modules/**'
    debounceMs: 500
    ignorePatterns: []

chunking:
  strategy: content-aware
  maxSizes:
    agentSessions: 400
    obsidianNotes: 500
    codeFiles: 400
    configuration: per-key
    plainText: 450
  overlap: 50
  hardCap: 600

enrichment:
  enabled: false

mcp:
  url: http://localhost:8080/mcp
  timeoutMs: 2000
  maxRetries: 0
  retryDelayMs: 50

telemetry:
  enabled: false
