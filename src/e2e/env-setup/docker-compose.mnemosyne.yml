# mcp-proxy → Mnemosyne stdio bridge for e2e tests.
# Usage:
#   docker compose -f docker-compose.mnemosyne.yml -p rag-e2e-mnemosyne up -d --wait
#   docker compose -f docker-compose.mnemosyne.yml -p rag-e2e-mnemosyne down -v

services:
  mnemosyne-mcp:
    build:
      context: .
      dockerfile: ./Dockerfile.mnemosyne
    ports:
      - "8765:3000"
    volumes:
      - ../../../data/e2e:/data
    environment:
      - PROXY_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(1); r=s.connect_ex(('127.0.0.1',3000)); s.close(); exit(0 if r==0 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
