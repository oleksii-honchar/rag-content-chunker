# Better Mnemosyne — multi-tenant namespace-aware MCP server for e2e tests.
# Usage:
#   docker compose -f docker-compose.mnemosyne.yml -p rag-e2e-mnemosyne up -d --wait
#   docker compose -f docker-compose.mnemosyne.yml -p rag-e2e-mnemosyne down -v

services:
  mnemosyne-mcp:
    image: tuiteraz/better-mnemosyne:latest
    ports:
      - '3000:3000'
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      - ../../../data/e2e:/data/mnemosyne/data
    command: ['python', 'main.py']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
